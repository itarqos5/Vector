# Example: Vector in front of two game servers on the same compose network.
# Start with:  VECTOR_DASHBOARD_PASSWORD=change-me docker compose up -d
services:
  vector:
    build: .
    restart: unless-stopped
    stdin_open: true   # lets `docker attach vector` use the console commands
    tty: true
    ports:
      - "25565:25565"   # players
      - "3000:3000"     # dashboard (protect it: set a password and ideally put HTTPS in front)
    environment:
      VECTOR_EULA: "true"                       # you accept https://aka.ms/MinecraftEULA by setting this
      VECTOR_BIND_HOST: "0.0.0.0"
      VECTOR_DASHBOARD_PASSWORD: "${VECTOR_DASHBOARD_PASSWORD:?set VECTOR_DASHBOARD_PASSWORD}"
      VECTOR_BALANCE_MODE: "least-connections"
      VECTOR_BACKENDS: '[{"name":"lobby-1","host":"lobby-1","port":25565},{"name":"lobby-2","host":"lobby-2","port":25565}]'
      VECTOR_WORKER_THREADS: "2"
    volumes:
      - vector-data:/data
    depends_on:
      - lobby-1
      - lobby-2

  lobby-1:
    image: itzg/minecraft-server
    environment: { EULA: "TRUE", ONLINE_MODE: "TRUE" }
  lobby-2:
    image: itzg/minecraft-server
    environment: { EULA: "TRUE", ONLINE_MODE: "TRUE" }

volumes:
  vector-data:
