name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '22'
          cache: maven
      - name: Build and test
        run: mvn -B -ntp verify
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: vector-jar
          path: target/vector-*.jar
          if-no-files-found: error
